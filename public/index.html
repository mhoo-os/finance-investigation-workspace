<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Finance Investigation Workspace — synthetic preview</title>
    <style>body{font:16px/1.5 system-ui,sans-serif;max-width:960px;margin:2rem auto;padding:0 1rem;color:#172033}h1{margin-bottom:0}.note{color:#586174}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1rem}.card{border:1px solid #d7dce5;border-radius:10px;padding:1rem}code{word-break:break-all}table{border-collapse:collapse;width:100%;margin-top:.5rem}td,th{border-bottom:1px solid #d7dce5;padding:.5rem;text-align:left;vertical-align:top}.table-scroll{overflow-x:auto}.match{border-left:4px solid #198754}.anomaly{border-left:4px solid #c43b2f}</style>
  </head>
  <body>
    <main>
      <h1>Finance Investigation Workspace</h1>
      <p class="note">Synthetic-only investigator preview. Staging requires Cloudflare Access; no provider connection, OAuth flow, or client data is used.</p>
      <div id="app" aria-live="polite"><p class="note" role="status">Loading synthetic evidence…</p></div>
      <noscript><p role="alert">JavaScript is required to load the synthetic investigation data.</p></noscript>
    </main>
    <script type="module">import { boot } from './app.js'; boot(document.querySelector('#app'));</script>
  </body>
</html>
